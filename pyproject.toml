[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stitchgraph"
version = "3.32.0"
description = "Local-first, MCP-native code-intelligence: dead code, holes, orientation, impact — ranked by what's live, every answer carrying confidence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "RexBytes" }]
keywords = ["code-intelligence", "mcp", "graph", "static-analysis", "dead-code"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Quality Assurance",
]

# The DEFAULT install is the full-power one (v3.31.0): CLI, MCP, polyglot
# grammars, precise resolution, the adjacency sidecar (numpy), GraphBLAS and
# sparse solvers — because every accelerated path is pinned byte-identical to
# its pure-Python reference, defaulting to fast costs nothing in trust.
# The CODE still treats every one of these as optional (guarded imports), so a
# lean footprint remains fully supported: `pip install --no-deps stitchgraph`
# gives the stdlib-only library core, and `--pure` / STITCHGRAPH_PURE=1 forces
# the reference paths even with everything installed. The core-only CI job
# pins that degradation story.
dependencies = [
  "typer>=0.12",
  "mcp>=1.0",
  "tree-sitter>=0.25.2,<1",
  "tree-sitter-language-pack>=0.7,<1.0",
  "jedi>=0.19",
  "sqlglot>=20",
  "numpy>=1.24",
  "python-graphblas>=2023.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]
mcp = ["mcp>=1.0"]
# Polyglot extraction (JS/TS, Rust, C/C++, C#, Bash) via tree-sitter.
# DEFAULT is the bundled-grammar line (<1.0): its wheels ship the parsers, so a
# `pip install` is fully offline / self-contained (issue #12). The 1.x line dropped
# bundling for a runtime download-from-GitHub model that breaks offline/CI/air-gapped.
treesitter = ["tree-sitter>=0.25.2,<1", "tree-sitter-language-pack>=0.7,<1.0"]
# Opt-in: the download-model line (1.x) — smaller wheel + newest grammars, but fetches
# parsers over the network on first use. For users who want the latest grammars and
# have network at runtime. stitchgraph's loader uses whatever is installed.
treesitter-download = ["tree-sitter>=0.25.2,<1", "tree-sitter-language-pack>=1.0,<2"]
precise = ["jedi>=0.19"]            # jedi-accurate Python resolution (reindex --precise)
resolve = ["sqlglot>=20"]           # SQL resolver
algebra = ["python-graphblas>=2023.0"]
spectral = ["scipy>=1.10"]          # sparse eigensolver/svds — uncaps find_subsystems and find_modes on large graphs
# Everything (offline-by-default grammar line).
all = [
  "typer>=0.12",
  "mcp>=1.0",
  "tree-sitter>=0.25.2,<1",
  "tree-sitter-language-pack>=0.7,<1.0",
  "jedi>=0.19",
  "sqlglot>=20",
  "python-graphblas>=2023.0",
  "scipy>=1.10",
]
dev = [
  "pytest>=8.0", "pytest-cov", "hypothesis", "ruff", "mypy",
  "typer>=0.12", "mcp>=1.0", "tree-sitter>=0.25.2,<1", "tree-sitter-language-pack>=0.7,<1.0",
  "jedi>=0.19", "sqlglot>=20", "python-graphblas>=2023.0", "scipy>=1.10",
]

[project.scripts]
stitchgraph = "stitchgraph.adapters.cli:main"
stitchgraph-mcp = "stitchgraph.adapters.mcp:main"

[project.urls]
Homepage = "https://github.com/RexBytes/stitchgraph"
Repository = "https://github.com/RexBytes/stitchgraph"
Changelog = "https://github.com/RexBytes/stitchgraph/blob/main/CHANGELOG.md"
Issues = "https://github.com/RexBytes/stitchgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stitchgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["review-kit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 line-length case-by-case; B904 lazy reraise; B008 typer defaults;
# UP042 str+Enum is intentional (explicit .value everywhere).
ignore = ["E501", "B904", "B008", "UP042"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["review-kit"]

