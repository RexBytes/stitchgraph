name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all,dev]"
      - run: pytest -q

  lint:
    name: lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all,dev]"
      - run: ruff check src tests
      - run: mypy

  # Prove the stdlib-only core: install the package with NO dependencies at all
  # (the default install is full-power since v3.31.0, so this needs --no-deps),
  # so every gated surface (numpy/sidecar, tree-sitter, graphblas, sqlglot, jedi,
  # mcp) is absent and its tests must skip cleanly rather than error. This job is
  # what keeps `pip install --no-deps stitchgraph` a supported lean footprint.
  core-only:
    name: core-only (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install --no-deps -e .
      - run: pip install pytest
      - run: pytest -q
